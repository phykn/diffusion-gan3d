images:
  xy: data
  xz: data
  yz: data

resolution:
  crop_size: 128
  lo_res_size: 64
  sr_scale: 2

structure:
  isotropic: true
  depth_gradient: false
  mirror_symmetric: true

tune:
  lr: {}
  sr:
    # One image is the only real data, so the critic memorizes it late in
    # training and SR surfaces turn into 1-voxel pits. Isotropic, mirror-
    # symmetric data makes every flip/rotation a true symmetry, so always apply
    # them; R2 matches R1 as in R3GAN. SR exports its latest step, so archive
    # often to pick the best one by hand.
    augmentation:
      probability: 1.0
    loss:
      r2_weight: 0.5
    train:
      archive_every_steps: 500
