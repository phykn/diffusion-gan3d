images:
  xy: data
  xz: data
  yz: data

resolution:
  crop_size: 128
  lo_res_size: 64
  sr_scale: 2

structure:
  isotropic: true
  depth_gradient: false
  mirror_symmetric: true

tune:
  lr:
    # Same settings as SR. R1/R2 end at 0.5 of their weights: at 0.3 the
    # real-fake critic score gap still widened to the end, and back at full
    # weight the late selection score was 15% worse.
    augmentation:
      probability: 1.0
    loss:
      r2_weight: 0.5
    burn_in:
      regularization_scale: 0.5
  sr:
    # One image is the only real data, so the critic memorizes it late in
    # training and SR surfaces turn into 1-voxel pits. Isotropic, mirror-
    # symmetric data makes every flip/rotation a true symmetry, so always apply
    # them; R2 matches R1 as in R3GAN. R1/R2 end at 0.5 of their weights, as
    # in LR, instead of 0.1.
    augmentation:
      probability: 1.0
    loss:
      r2_weight: 0.5
    burn_in:
      regularization_scale: 0.5
