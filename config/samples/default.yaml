images:
  xy: data
  xz: data
  yz: data

resolution:
  crop_size: 128
  lo_res_size: 64
  sr_scale: 2

structure:
  isotropic: true
  depth_gradient: false
  mirror_symmetric: true

tune:
  lr:
    # The LR critic memorizes the one image too: after burn-in its real scores
    # climb while fake scores stay flat, and two-point error rises again past
    # 6500 steps. Same fix as SR, and keep R1/R2 at 0.3 of their weights after
    # burn-in instead of 0.1.
    augmentation:
      probability: 1.0
    loss:
      r2_weight: 0.5
    burn_in:
      regularization_scale: 0.3
  sr:
    # One image is the only real data, so the critic memorizes it late in
    # training and SR surfaces turn into 1-voxel pits. Isotropic, mirror-
    # symmetric data makes every flip/rotation a true symmetry, so always apply
    # them; R2 matches R1 as in R3GAN.
    augmentation:
      probability: 1.0
    loss:
      r2_weight: 0.5
