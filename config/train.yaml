data:
  folder:
    0: ../data/generated/slices/0
    1: ../data/generated/slices/1
    2: ../data/generated/slices/2
  crop_size: 128
  patch_size: 64
  num_phases: 3
  batch_size: 8
  num_workers: 0

model:
  base_channels: 16
  channel_multipliers: [1, 2, 4, 4]
  embedding_channels: 128
  latent_channels: 64
  critic_channels: [32, 64, 128, 256]
  gradient_checkpointing: true

diffusion:
  timesteps: 11
  beta_min: 0.1
  beta_max: 20.0

anchor:
  dropout: 0.25
  loss_weight: 1.0
  max_planes: 3

fraction:
  loss_weight: 1.0
  dropout: 0.1

optim:
  generator_lr: 0.00016
  critic_lr: 0.0001
  beta1: 0.5
  beta2: 0.9
  r1_gamma: 0.05
  r1_interval: 16
  critic_local_weight: 0.5

train:
  steps: 50000
  volume_batch_size: 1
  slices_per_axis: 16
  mixed_precision: true
  ema_decay: 0.999
  save_every_steps: 100
  checkpoint:
    model: null
    critic_0: null
    critic_1: null
    critic_2: null
