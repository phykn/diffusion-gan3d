data:
  folders:
    0: [data]
    1: [data]
    2: [data]
  num_phases: 2
  crop_size: 128
  input_size: 128
  augment: true
  batch_size: 8
  num_workers: 0

model:
  base_channels: 16
  channel_multipliers: [1, 2, 4, 4]
  embedding_channels: 128
  latent_channels: 64
  critic_channels: [32, 64, 128, 256]
  gradient_checkpointing: true

diffusion:
  timesteps: 10
  beta_min: 0.1
  beta_max: 20.0

anchor:
  start_ratio: 0.0
  ramp_ratio: 0.2
  dropout_probability: 0.2
  multi_anchor_probability: 0.5
  max_density: 0.05
  min_spacing: 4
  mixed_axis_probability: 0.5
  teacher_bank_size_mib: 128
  loss_weight: 1.0

connectivity:
  replay_triplets_per_axis: 4
  replay_capacity_per_axis: 64
  max_triplets_per_step: 4
  reversal_invariant: true
  loss_weight: 0.25

vf:
  dropout_probability: 0.2
  loss_weight: 1.0

optim:
  denoiser_lr: 0.00016
  critic_lr: 0.0001
  beta1: 0.5
  beta2: 0.9
  r1_gamma: 0.05
  r1_interval: 16
  local_loss_weight: 0.5

train:
  total_steps: 10000
  volume_sizes: [128, 136, 144, 152, 160]
  volume_batch_size: 1
  slice_pairs_per_axis: 16
  mixed_precision: true
  ema_decay: 0.999
  save_every_steps: 100
  generator: run/08050116/generator.pt
  critic_0: run/08050116/critic_0.pt
  critic_1: run/08050116/critic_1.pt
  critic_2: run/08050116/critic_2.pt
  critic_c: run/08050116/critic_c.pt
