data:
  folder:
    0: [data]
    1: [data]
    2: [data]
  crop_size: 128
  patch_size: 64
  augment: true
  num_phases: 2
  batch_size: 8
  num_workers: 0

model:
  base_channels: 16
  channel_multipliers: [1, 2, 4, 4]
  embedding_channels: 128
  latent_channels: 64
  critic_channels: [32, 64, 128, 256]
  gradient_checkpointing: true

diffusion:
  timesteps: 10
  beta_min: 0.1
  beta_max: 20.0

anchor:
  dropout: 0.2
  loss_weight: 1.0
  seam_weight: 0.25
  max_planes: 4

vf:
  loss_weight: 1.0
  dropout: 0.2

optim:
  generator_lr: 0.00016
  critic_lr: 0.0001
  beta1: 0.5
  beta2: 0.9
  r1_gamma: 0.05
  r1_interval: 16
  critic_local_weight: 0.5

train:
  steps: 30000
  volume_batch_size: 1
  volume_sizes: [64, 96]
  slices_per_axis: 16
  mixed_precision: true
  ema_decay: 0.999
  save_every_steps: 100
  checkpoint: null
