data:
  domains:
    0:
      0: [data]
      1: [data]
      2: [data]

  num_phase: 2
  crop_partial: true
  crop_size: 128
  input_size: 128

  augment: isotropic
  augment_prob: 0.5
  domain_prob: 0.8

  batch_size: 8
  num_workers: 0

model:
  grad_checkpoint: true

  generator:
    channels: [16, 32, 64, 64]
    condition_channels: 128
    latent_channels: 64

  critic:
    channels: [32, 64, 128, 256]
    local_loss_weight: 0.5
    r1_weight: 0.2
    r1_interval: 16

diffusion:
  steps: 10
  beta_min: 0.1
  beta_max: 20.0

anchor:
  multiscale_input: true

  start_step: 0
  ramp_steps: 500
  train_prob: 0.80
  cross_domain_prob: 0.20

  pixel_weight: 0.05

  connectivity:
    volume_count: 16
    refresh_every: 500
    weight: 0.25
    phase_transition_weight: 0.10

vf:
  max_samples: 4
  weight: 1.0

condition_dropout:
  joint_each_prob: 0.05

optim:
  generator_lr: 0.00016
  critic_lr: 0.0001
  adam_betas: [0.5, 0.9]
  ema_decay: 0.999

train:
  init_weights: run/08161634
  steps: 20000

  volume_batch_size: 1
  pairs_per_axis: 16
  amp: true

  update_weights_every: 100
  archive_every: 5000
