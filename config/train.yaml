# augment presets:
#   false          Disable augmentation.
#   isotropic      All three axes are equivalent.
#   transverse_0   Axis 0 is the unique direction.
#   transverse_1   Axis 1 is the unique direction.
#   transverse_2   Axis 2 is the unique direction.
#   directional    Preserve axis identities; allow flips and 180-degree rotations.

data:
  folders:
    0: [data]
    1: [data]
    2: [data]
  num_phases: 2
  crop_size: 128
  input_size: 128
  augment: isotropic
  augment_prob: 0.5
  batch_size: 8
  num_workers: 0

model:
  base_channels: 16
  channel_multipliers: [1, 2, 4, 4]
  embedding_channels: 128
  latent_channels: 64
  critic_channels: [32, 64, 128, 256]
  gradient_checkpointing: true

diffusion:
  timesteps: 10
  beta_min: 0.1
  beta_max: 20.0

anchor:
  start_step: 3000
  ramp_steps: 6000
  training_probability: 0.80
  multi_anchor_prob: 0.5
  max_density: 0.05
  min_spacing: 4
  mixed_axis_prob: 0.5
  teacher_bank_size_mib: 128
  loss_weight: 1.0

conditioning:
  cfg_dropout:
    # With both conditions, each of anchor-null, VF-null, and joint-null uses 5%.
    drop_each_prob: 0.05
    # Before anchors start, VF alone is dropped on 10% of samples.
    single_condition_drop_prob: 0.10

connectivity:
  replay_triplets_per_axis: 4
  replay_capacity_per_axis: 64
  max_triplets_per_step: 4
  reversal_invariant: true
  loss_weight: 0.25
  normal_transition_loss_weight: 0.10

vf:
  loss_weight: 1.0

scale_consistency:
  overlap: 8
  probability: 0.30
  start_step: 1000
  ramp_steps: 4000
  loss_weight: 1.0

optim:
  denoiser_lr: 0.00016
  critic_lr: 0.0001
  beta1: 0.5
  beta2: 0.9
  r1_gamma: 0.2
  r1_interval: 16
  local_loss_weight: 0.5

train:
  total_steps: 20000
  volume_sizes: [128, 144]
  volume_batch_size: 1
  slice_pairs_per_axis: 16
  mixed_precision: true
  ema_decay: 0.999
  save_every_steps: 100
  checkpoint_every_steps: 5000
