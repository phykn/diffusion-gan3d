# augment presets:
#   false        Disable augmentation.
#   isotropic    Allow all rotations and reflections.
#   anisotropic  Preserve directions; allow only left-right flips.

data:
  domains:
    0:
      0: [data]
      1: [data]
      2: [data]
  num_phases: 2
  crop_size: 128
  input_size: 128
  allow_partial_crop: true
  augment: isotropic
  augment_prob: 0.5
  batch_size: 8
  num_workers: 0
  domain_dropout: 0.2

model:
  base_channels: 16
  channel_multipliers: [1, 2, 4, 4]
  embedding_channels: 128
  latent_channels: 64
  critic_channels: [32, 64, 128, 256]
  gradient_checkpointing: true

diffusion:
  timesteps: 10
  beta_min: 0.1
  beta_max: 20.0

anchor:
  start_step: 3000
  ramp_steps: 6000
  training_probability: 0.80
  # Occasionally treat a provider-domain section as an external anchor for a
  # target domain that does not own that axis. Target-domain VF remains local.
  shared_axis_probability: 0.20
  # Keep pseudo multi-anchor training off while relation learning is evaluated.
  multi_anchor_prob: 0.0
  max_density: 0.05
  min_spacing: 4
  mixed_axis_prob: 0.5
  teacher_bank_size_mib: 128
  loss_weight: 1.0
  coarse_pool_size: 4
  coarse_loss_weight: 1.0
  pixel_loss_weight: 0.05

conditioning:
  cfg_dropout:
    # With both conditions, each of anchor-null, VF-null, and joint-null uses 5%.
    drop_each_prob: 0.05
    # Before anchors start, VF alone is dropped on 10% of samples.
    single_condition_drop_prob: 0.10

connectivity:
  replay_triplets_per_axis: 4
  replay_capacity_per_axis: 64
  max_triplets_per_step: 4
  reversal_invariant: true
  loss_weight: 0.25
  normal_transition_loss_weight: 0.10

relation:
  # Store only EMA morphology descriptors and phase-relation curves, never images.
  # Wait until the unconditional prior and EMA output are mature enough that the
  # first frozen bank does not preserve early-training relations indefinitely.
  start_step: 9000
  loss_weight: 0.02
  bank_capacity_per_axis: 64
  profiles_per_axis: 4
  neighbors: 8
  quantile_low: 0.10
  quantile_high: 0.90

vf:
  loss_weight: 1.0

optim:
  denoiser_lr: 0.00016
  critic_lr: 0.0001
  beta1: 0.5
  beta2: 0.9
  r1_gamma: 0.2
  r1_interval: 16
  local_loss_weight: 0.5

train:
  total_steps: 20000
  volume_batch_size: 1
  slice_pairs_per_axis: 16
  mixed_precision: true
  ema_decay: 0.999
  save_every_steps: 100
  checkpoint_every_steps: 5000
