stage: sr
data: config/data/default.yaml

model:
  generator:
    scale_factor: 2  # HR/LR 격자 크기 비율. crop_size와 독립적이다.
    channels: 16
    blocks: 3

  critic:
    # 1개: [[xy, xz, yz]], 2개: [[xy], [xz, yz]], 3개: 아래 설정
    plane_groups: [[xy], [xz], [yz]]
    channels: [32, 64, 128]

# 단면의 행/열: xy=(y,x), xz=(z,x), yz=(z,y). 그룹 공유와 별도로 설정한다.
augmentation:
  probability: 0.5

  planes:
    xy:
      flip_axes: [x, y]
      rotate_90: true

    xz:
      flip_axes: [x]
      rotate_90: false

    yz:
      flip_axes: [y]
      rotate_90: false

loss:
  gradient_penalty_weight: 10.0

  downsample_consistency_weight: 10.0

optim:
  generator_lr: 0.0001  # critic_lr를 생략하면 같은 학습률 사용

# 고정된 LR 모델에서 생성한 조건용 볼륨이며, 측정한 3D 정답이 아니다.
lr_bank:
  samples_per_domain: 8
  guidance: 0.9  # bank 생성 시 도메인 조건 강도. gen.yaml과 독립적이다.

train:
  total_steps: 20000

  volume_batch_size: 1
  slices_per_plane: 8
  critic_updates_per_step: 3  # 생성기 1회 갱신당 critic 갱신 횟수

  checkpoint_every_steps: 100
