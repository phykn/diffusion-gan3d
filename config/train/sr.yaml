stage: sr
data: config/data/default.yaml

model:
  generator:
    channels: [16, 32, 64, 64]

  critic:
    # 등방 구조: 세 평면이 하나의 critic을 공유한다.
    plane_groups: [[xy, xz, yz]]
    channels: [32, 64, 128]

  diffusion:
    num_steps: 10

# 단면의 행/열: xy=(y,x), xz=(z,x), yz=(z,y). 그룹 공유와 별도로 설정한다.
augmentation:
  probability: 0.5

  planes:
    xy:
      flip_axes: [x, y]
      rotate_90: true

    xz:
      flip_axes: [x, z]
      rotate_90: true

    yz:
      flip_axes: [y, z]
      rotate_90: true

loss:
  r1_weight: 0.2

  downsample_consistency_weight: 10.0

optim:
  generator_lr: 0.0001  # critic_lr를 생략하면 같은 학습률 사용

# 고정된 LR 모델에서 생성한 조건용 볼륨이며, 측정한 3D 정답이 아니다.
lr_bank:
  samples_per_domain: 8
  guidance: 0.9  # bank 생성 시 도메인 조건 강도. gen.yaml과 독립적이다.

train:
  total_steps: 20000

  volume_batch_size: 1
  real_batch_size: 8
  slice_pairs_per_plane: 8

  checkpoint_every_steps: 100
