stage: low_res
nickname: anode
data: config/data/simul_anode.yaml

model:
  generator:
    channels: [16, 32, 64, 64]

  critic:
    input_mode: single  # single: x_t only; pair: x_t and x_{t+1}
    plane_groups: [[xy], [xz, yz]]  # xy discs differ from xz/yz flakes
    channels: [32, 64, 128, 256]

  diffusion:
    num_steps: 10

augmentation:
  # No flips: mirrored reals make either tilt direction look real, so the
  # generator tilts every particle one way; unflipped data keeps the real tilts.
  probability: 0.0
  auto_planes: true

conditioning:
  height_enabled: true  # silicon fraction depends on electrode depth
  spatial_profile:
    enabled: true  # match per-height phase fractions of real xz/yz crops
  anchor:
    probability: 0.8
    ramp_steps: 500

loss:
  r1_weight: 1.0  # two volumes: critic overfits after ~5k steps at 0.5
  r2_weight: 0.1
  r1_every_steps: 8

  anchor_pixel_weight: 0.05
  anchor_continuity_weight: 0.1
  anchor_neighborhood_weight: 0.1
  anchor_neighborhood_radius: 2
  volume_fraction_weight: 1.0
  # smooth_l1 (beta=1) is quadratic at these profile errors, so 1.0 barely pulls.
  spatial_profile_weight: 30.0

  group_statistics:
    weight: 0.1
    max_gap: 8
    tolerance: 0.01
    ramp_steps: 5000

  connectivity:
    max_slice_gap: 8
    adversarial_weight: 0.0
    local_weight: 0.5
    real_transition_weight: 0.1
    ramp_steps: 5000

optim:
  generator_lr: 0.0001
  critic_lr: 0.00005

train:
  total_steps: 40000

  real_batch_size: 8
  volume_batch_size: 1
  slice_pairs_per_plane: 16

  weights_every_steps: 25
  archive_every_steps: 1250
  structure_every_steps: 25
