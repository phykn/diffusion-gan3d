stage: low_res

model:
  generator:
    channels: [16, 32, 64, 64]

  critic:
    channels: [32, 64, 128, 256]

  diffusion:
    num_steps: 10

augmentation:
  auto_planes: true

conditioning:
  anchor:
    probability: 0.8

loss:
  r1_weight: 0.5
  r2_weight: 0.1
  r1_every_steps: 8

  anchor_pixel_weight: 0.05
  volume_fraction_weight: 1.0

  connectivity:
    max_slice_gap: 8
    ramp_steps: 5000

optim:
  generator_lr: 0.00016
  critic_lr: 0.0001

train:
  total_steps: 10000

  real_batch_size: 8
  volume_batch_size: 1
  slice_pairs_per_plane: 16

  weights_every_steps: 500
  archive_every_steps: 2500
  structure_every_steps: 250
