stage: low_res

model:
  generator:
    channels: [16, 32, 64, 64]

  critic:
    channels: [32, 64, 128, 256]

  diffusion:
    num_steps: 10

augmentation:
  auto_planes: true

loss:
  r1_weight: 0.5
  r2_weight: 0.1
  r1_every_steps: 8

  volume_fraction_weight: 1.0

  real_transition:
    max_gap: 8
    ramp_steps: 5000

optim:
  generator_lr: 0.00016
  critic_lr: 0.0001

# Learning rates, Adam beta2, R1/R2 and EMA move to their end values over
# these steps; see README.md (Train).
burn_in:
  steps: 5000

train:
  total_steps: 10000

  real_batch_size: 8
  volume_batch_size: 1
  slice_pairs_per_plane: 16

  weights_every_steps: 500
  archive_every_steps: 2500
  structure_every_steps: 250
